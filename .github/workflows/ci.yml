name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: verify exercises (OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        otp: ["26", "27"]
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
      - name: Runner smoke test
        run: ./erlanglings list
      - name: Every solution passes, every starter fails
        run: ./erlanglings verify
